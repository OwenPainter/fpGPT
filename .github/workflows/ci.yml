name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RTL tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator
          iverilog -V | head -1
          verilator --version

      - name: Install Python dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Python unit tests + Icarus elaboration/lint + board smoke test.
      - name: make test
        run: make test
