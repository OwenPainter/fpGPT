<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fpGPT &mdash; FPGA chat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">&#9632;</span>
      <div>
        <h1>fpGPT</h1>
        <p class="subtitle">language model on FPGA fabric &mdash; host bridge</p>
      </div>
    </div>
    <div class="badges">
      <select id="model-selector" class="badge badge-select" title="Select Model Engine" style="background-color: var(--bg2); color: var(--fg); border: 1px solid var(--border); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem; outline: none; cursor: pointer;">
        <option value="smollm">ChatGPT Model</option>
        <option value="tinystories">TinyStories LLM</option>
        <option value="fpga">FPGA Hardware</option>
      </select>
      <span id="fpga-port-controls" style="display: none;">
        <select id="fpga-port-selector" class="badge badge-select" title="Select COM port" style="background-color: var(--bg2); color: var(--fg); border: 1px solid var(--border); padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.85rem; outline: none; cursor: pointer;">
          <option value="">Select COM port&hellip;</option>
        </select>
        <button id="fpga-connect" class="badge" style="cursor:pointer; padding: 0.2rem 0.6rem; font-size: 0.85rem; background: var(--accent); color: #fff; border: none; border-radius: 4px;" disabled>Connect</button>
        <button id="fpga-refresh" class="badge" style="cursor:pointer; padding: 0.2rem 0.5rem; font-size: 0.85rem; background: transparent; color: var(--fg-muted); border: 1px solid var(--border); border-radius: 4px;" title="Refresh port list">&#x21bb;</button>
      </span>
      <span class="badge" id="badge-transport">transport: &mdash;</span>
      <span class="badge" id="badge-mode">mode: &mdash;</span>
      <span class="badge" id="badge-model">model: &mdash;</span>
      <span class="dot" id="conn-dot" title="connection"></span>
      <button class="btn-shutdown" id="btn-shutdown" title="Shut down the local server">Stop Server</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab active" id="tab-chat" role="tab" aria-selected="true"
            aria-controls="panel-chat" data-panel="panel-chat">LLM Chat</button>
  </nav>

  <section id="panel-chat" class="panel active" role="tabpanel">
    <div class="banner" id="banner">
      Research prototype. The on-FPGA model is a small, lightly trained
      character model &mdash; replies are a fixed-length character stream, not a
      chatbot. Expect low-quality text.
    </div>

    <main id="chat" class="chat" aria-live="polite"></main>

    <footer class="composer">
      <div class="composer-row">
        <textarea id="prompt" rows="2" placeholder="Type a prompt&hellip; (Enter to send, Shift+Enter for newline)"
                  autocomplete="off" spellcheck="false"></textarea>
        <div class="buttons">
          <button id="send" class="primary">Send</button>
          <button id="reset" title="Best-effort clear">Reset</button>
          <button id="export" title="Download the transcript">Export</button>
        </div>
      </div>
      <div class="composer-meta">
        <span id="char-count">0 chars</span>
        <span id="char-range"></span>
        <span id="gen-info"></span>
        <span class="state" id="state-text">idle</span>
      </div>
    </footer>
  </section>


  <script src="/static/app.js"></script>
</body>
</html>
